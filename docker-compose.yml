services:
  pilot_trader_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: pilot-trader-dashboard:latest
    container_name: pilot_trader_dashboard
    restart: unless-stopped
    # Match the host user, who owns the atomically written mode-0600 data files.
    # Root with all capabilities dropped cannot bypass their permissions.
    user: "1000:1000"
    init: true

    # Own bridge (br-pilot, 172.30.250.0/24) shared ONLY with nginx-proxy-manager,
    # which reaches the dashboard as pilot_trader_dashboard:8051. Nothing is
    # published on the host (no `ports:`). Since 2026-10-14; before that the
    # container ran with network_mode: host (an IBKR leftover) and could reach every
    # loopback-only dashboard. Firewall isolation of this bridge (no access to the
    # host, LAN, router or other Docker networks; internet only) lives outside this
    # repo: /usr/local/sbin/pilot-isolation.sh + pilot-isolation.service (chain
    # PILOT-ISOLATION in DOCKER-USER) and the UFW rule "deny in on br-pilot".
    networks:
      - pilot_net
    # Public resolvers: a router/loopback resolver would be inside the blocked ranges.
    dns:
      - 1.1.1.1
      - 9.9.9.9

    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      # Read-only root filesystem: yfinance's cache dir resolves under HOME.
      - HOME=/tmp
      # gunicorn does not run dashboard.py's __main__, so ask for the price-cache warmer.
      - PILOT_START_WARMER=1
      # Compose reads this one credential from .env; the app needs only credits.
      - GETXAPI_KEY=${GETXAPI_KEY:-}

    volumes:
      # Bind-mount the host project so trades.json / positions.json / data/ are live
      # inside the container at the path the app expects (atomic replaces by the
      # cron pipeline must stay visible, so a directory mount, not single files).
      # Read-only: a dashboard compromise must not rewrite source or ledgers.
      - .:/app:ro
      # The one writable path: the dashboard's own derived cache (immutable
      # past closes, GetXAPI balance snapshots) -- never source or ledgers.
      - ./data/cache:/app/data/cache
      # Hide what the dashboard does not need: API secrets, logs, tweet snapshots.
      - /dev/null:/app/.env:ro
      - /dev/null:/app/monitor.log:ro
      - /dev/null:/app/twitter_digest.log:ro
      - /dev/null:/app/youtube_monitor.log:ro
      - /dev/null:/app/reconcile.log:ro
      - /dev/null:/app/auto_backup.log:ro
      - /dev/null:/app/check_model_deprecations.log:ro
      - /dev/null:/app/tweets_incomesharks.json:ro
      - /dev/null:/app/tweets_traderstewie.json:ro
      # No Docker socket.

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      # Empty, read-only views over directories the dashboard never reads.
      - /app/.git:ro,size=4k
      - /app/.venv:ro,size=4k
      - /app/.claude:ro,size=4k
      - /app/.code-review-graph:ro,size=4k
      - /app/logs:ro,size=4k
      - /app/results:ro,size=4k
      - /app/docs:ro,size=4k
      - /app/tests:ro,size=4k

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 128

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Dash serves "/" with HTTP 200 once up.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys;\nsys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8051/', timeout=5).status == 200 else 1)"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  pilot_net:
    name: pilot_net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-pilot
    ipam:
      config:
        - subnet: 172.30.250.0/24
